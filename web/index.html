<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mourchid Jibaya · مرشد جباية</title>
<style>
:root{--fond:#F3F6F4;--carte:#FFFFFF;--encre:#1C2B30;--doux:#5A6A6E;--sombre:#0E3B43;--or:#B8862B;--menthe:#E2EBE8;--ligne:#D3DEDB;
--ok:#2E7D5B;--alerte:#B8862B;--crit:#B3261E;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.55 "Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
[hidden]{display:none!important}
header{background:var(--sombre);color:#F3F6F4;padding:14px 16px}
.barre{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px}.logo small{display:block;font-weight:400;font-size:13px;color:#BFD8D5}
.langues{margin-inline-start:auto;display:flex;gap:6px}
.langues button{background:transparent;color:#F3F6F4;border:1px solid #6F9A96;border-radius:20px;padding:4px 12px;cursor:pointer;font:inherit;font-size:14px}
.langues button[aria-pressed=true]{background:var(--or);border-color:var(--or);color:var(--sombre);font-weight:700}
nav{max-width:980px;margin:14px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--ligne);background:var(--carte);border-radius:22px;padding:8px 16px;cursor:pointer;font:inherit;font-size:15px;color:var(--sombre)}
nav button[aria-selected=true]{background:var(--sombre);color:#fff;border-color:var(--sombre)}
nav .etiquette{font-size:11px;color:var(--or);font-weight:700;margin-inline-start:6px}
main{max-width:980px;margin:14px auto 40px;padding:0 16px}
.panneau{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:18px}
#fil{min-height:320px;max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
.msg{max-width:88%;padding:12px 14px;border-radius:var(--r);white-space:pre-wrap;word-wrap:break-word}
.msg.moi{align-self:flex-end;background:var(--sombre);color:#fff}
.msg.bot{align-self:flex-start;background:var(--menthe)}
.msg .titre{font-weight:700;margin-bottom:4px}
.ref{margin-top:10px;padding-top:8px;border-top:1px dashed #A9BEBA;font-size:13.5px;color:var(--doux);white-space:normal}
.badge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-inline-end:6px}
.b-officiel{background:#D9EFE3;color:var(--ok)}.b-confirmer{background:#F7EBD2;color:#8A6417}.b-interne{background:#E6E9EA;color:#51606A}
.url{display:block;direction:ltr;text-align:left;user-select:all;font-family:Consolas,monospace;font-size:12px;color:var(--sombre);margin-top:4px;word-break:break-all}
.url a{color:var(--sombre)}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.puce{border:1px solid var(--ligne);background:#fff;border-radius:18px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--sombre)}
.puce:hover{border-color:var(--or)}
.alerte{border-inline-start:4px solid #b7791f;background:#fff8e6;padding:8px 10px;border-radius:8px;margin-bottom:8px;font-size:14px}
.alerte.refus{border-color:#b42318;background:#fdecea}
.bouton{background:var(--or);color:var(--sombre);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.bouton.second{background:#fff;border:1px solid var(--sombre)}
form.saisie{display:flex;gap:8px;margin-top:12px}
form.saisie input{flex:1;padding:12px;border:1px solid var(--ligne);border-radius:10px;font:inherit}
label{display:block;font-size:14px;color:var(--doux);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--ligne);border-radius:10px;font:inherit;background:#fff}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ech{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--ligne);border-radius:12px;margin-top:8px;background:#fff}
.ech b{color:var(--sombre)}.ech .j{font-weight:700;color:var(--or);white-space:nowrap}.ech small{color:var(--doux);display:block}
.point{padding:10px 12px;border-radius:10px;margin-top:8px}
.p-ok{background:#E3F2EA}.p-info{background:var(--menthe)}.p-alerte{background:#F7EBD2}.p-critique{background:#F6DEDC}
.note{font-size:13px;color:var(--doux);margin-top:12px}
.agent{margin-top:12px;border:1px solid var(--or);border-radius:12px;padding:14px;background:#FFFBF2}
.agent h3{margin:0 0 6px;font-size:17px;color:var(--sombre)}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--ligne);border-radius:10px;font:inherit}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.chiffres div{background:var(--menthe);border-radius:12px;padding:12px}.chiffres b{display:block;font-size:26px;color:var(--sombre)}
.chiffres div.fort{background:var(--sombre);color:#E2EBE8}.chiffres div.fort b{color:var(--or)}
.benef{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.benef div{border:1px solid var(--ligne);border-radius:12px;padding:12px;background:#fff}.benef h4{margin:0 0 4px;color:var(--sombre)}
.rappel{margin-top:14px;border:1px solid var(--or);border-radius:12px;padding:14px;background:#FFFBF2}
.rappel h3{margin:0 0 6px;font-size:17px;color:var(--sombre)}.cases{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0}
.cases label{display:flex;align-items:center;gap:6px;margin:0;color:var(--encre);font-size:15px}.cases input{width:auto}
#bandeau{max-width:980px;margin:12px auto 0;padding:0 16px}#bandeau div{background:#F7EBD2;border:1px solid var(--or);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.carte{background:#fff;border:1px solid var(--or);border-radius:12px;padding:12px 14px;margin-top:8px;white-space:normal;color:var(--encre)}
.carte .ent{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;color:var(--sombre);border-bottom:1px dashed var(--ligne);padding-bottom:6px;margin-bottom:6px}
.carte dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}.carte dt{color:var(--doux)}.carte dd{margin:0}
.carte ol{margin:4px 0 0;padding-inline-start:20px;font-size:13.5px}.statut{background:#F7EBD2;color:#8A6417;border-radius:10px;padding:1px 8px;font-size:12px}
.curseurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.curseur{border:1px solid var(--ligne);border-radius:12px;padding:10px 12px;background:#fff}
.curseur .haut{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.curseur .val{font-weight:700;color:var(--sombre);font-size:18px;white-space:nowrap}
.curseur input[type=range]{width:100%;accent-color:var(--or);padding:0;border:0;margin:6px 0 2px}.curseur small{color:var(--doux);display:block;font-size:12.5px}
.titres-gain{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.titres-gain div{background:var(--sombre);color:#E2EBE8;border-radius:14px;padding:14px}.titres-gain b{display:block;font-size:28px;color:var(--or);line-height:1.2}
.calcul{list-style:none;padding:0;margin:0;counter-reset:etape}
.calcul li{counter-increment:etape;position:relative;background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:10px 14px;margin-bottom:8px;padding-inline-start:52px}
.calcul li::before{content:counter(etape);position:absolute;inset-inline-start:12px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--or);color:var(--sombre);font-weight:700;display:grid;place-items:center}
.calcul .lib{font-weight:700;color:var(--sombre)}.calcul .formule{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:14px;color:var(--encre);margin:4px 0}
.calcul .res{font-weight:700;color:var(--ok)}.calcul .base{font-size:12.5px;color:var(--doux)}
.apparait{animation:apparait .5s ease both}@keyframes apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.barres{display:grid;gap:10px}.barre .lib{font-size:14px;margin-bottom:4px}.barre .piste{background:var(--menthe);border-radius:8px;height:30px;overflow:hidden}
.barre .rempli{height:100%;border-radius:8px;display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:700;font-size:14px;white-space:nowrap;transition:width .9s cubic-bezier(.2,.8,.2,1);width:0}
.barre .sans{background:#8C9A9E}.barre .avec{background:var(--sombre)}
@media (prefers-reduced-motion:reduce){.apparait{animation:none}.barre .rempli{transition:none}}
h3.sous{margin:18px 0 6px;color:var(--sombre);font-size:17px}
footer{text-align:center;font-size:13px;color:var(--doux);padding:18px 16px 30px}
@media (max-width:600px){.msg{max-width:96%}header .logo{font-size:18px}}
</style>
</head>
<body>
<header><div class="barre">
  <div class="logo" id="nom">مرشد جباية<small id="devise"></small></div>
  <div class="langues" role="group" aria-label="Langue">
    <button data-l="ar">عربي</button><button data-l="fr">Français</button><button data-l="en">English</button>
  </div>
</div></header>

<nav role="tablist">
  <button role="tab" data-onglet="chat" aria-selected="true"><span data-t="ongChat"></span><span class="etiquette">T9</span></button>
  <button role="tab" data-onglet="ech" aria-selected="false"><span data-t="ongEch"></span><span class="etiquette">T4</span></button>
  <button role="tab" data-onglet="verif" aria-selected="false"><span data-t="ongVerif"></span><span class="etiquette">T4</span></button>
  <button role="tab" data-onglet="adm" aria-selected="false"><span data-t="ongAdm"></span></button>
  <button role="tab" data-onglet="src" aria-selected="false"><span data-t="ongSrc"></span></button>
</nav>

<div id="bandeau" aria-live="polite"></div>
<main>
  <section id="p-chat" class="panneau">
    <div id="fil" aria-live="polite"></div>
    <div class="puces" id="exemples"></div>
    <form class="saisie" id="f-question"><input id="q" autocomplete="off" maxlength="500"><button class="bouton" data-t="envoyer"></button></form>
    <p><button class="bouton second" id="b-agent" type="button" data-t="parler"></button></p>
    <div class="agent" id="f-agent" hidden>
      <h3 data-t="agentTitre"></h3>
      <label for="a-service" data-t="agentService"></label><select id="a-service"></select>
      <label for="a-question" data-t="agentQuestion"></label><textarea id="a-question" maxlength="500"></textarea>
      <label for="a-contact" data-t="agentContact"></label><input id="a-contact" maxlength="120" autocomplete="off">
      <p class="note" data-t="agentNote"></p>
      <p><button class="bouton" id="b-envoyer-agent" type="button" data-t="agentEnvoyer"></button> <button class="bouton second" id="b-annuler-agent" type="button" data-t="annuler"></button></p>
    </div>
    <p class="note" data-t="avert"></p>
  </section>

  <section id="p-ech" class="panneau" hidden>
    <label for="profil" data-t="profil"></label><select id="profil"></select>
    <div class="rappel">
      <h3 data-t="rapTitre"></h3>
      <p data-t="rapIntro" style="margin:0"></p>
      <div class="cases">
        <label><input type="checkbox" id="r-j7" checked><span data-t="rapJ7"></span></label>
        <label><input type="checkbox" id="r-j2" checked><span data-t="rapJ2"></span></label>
        <label><input type="checkbox" id="r-j0" checked><span data-t="rapJ0"></span></label>
      </div>
      <label for="r-mois" data-t="rapHorizon"></label>
      <select id="r-mois" style="max-width:220px"><option value="3"></option><option value="6" selected></option><option value="12"></option></select>
      <p><button class="bouton" id="b-ics" type="button" data-t="rapBouton"></button></p>
      <div id="r-lien"></div>
      <div class="cases"><label><input type="checkbox" id="r-ouverture"><span data-t="rapOuverture"></span></label></div>
      <p class="note" data-t="rapNote"></p>
    </div>
    <div id="liste-ech"></div>
    <p class="note" data-t="noteEch"></p>
  </section>

  <section id="p-verif" class="panneau" hidden>
    <p data-t="introVerif"></p>
    <div class="grille">
      <div><label data-t="vProfil"></label><select id="v-profil"><option value="pp"></option><option value="pm"></option></select></div>
      <div><label data-t="vPeriode"></label><input id="v-periode" type="month"></div>
      <div><label data-t="vCa"></label><input id="v-ca" inputmode="decimal" value="20000"></div>
      <div><label data-t="vTaux"></label><select id="v-taux"><option>19</option><option>13</option><option>7</option></select></div>
      <div><label data-t="vTva"></label><input id="v-tva" inputmode="decimal" value="3500"></div>
      <div><label data-t="vDed"></label><input id="v-ded" inputmode="decimal" value="1200"></div>
      <div><label data-t="vDepot"></label><input id="v-depot" type="date"></div>
    </div>
    <p><button class="bouton" id="b-verif" data-t="verifier"></button></p>
    <div id="res-verif"></div>
    <p class="note" data-t="noteVerif"></p>
  </section>

  <section id="p-adm" class="panneau" hidden>
    <p data-t="introAdm"></p>

    <h3 class="sous" data-t="admDirect"></h3>
    <div class="chiffres" id="adm-chiffres"></div>
    <div id="adm-detail"></div>

    <h3 class="sous" data-t="simTitre"></h3>
    <p class="note" data-t="simIntro"></p>
    <div class="curseurs" id="sim-curseurs"></div>

    <div class="titres-gain" id="sim-titres"></div>

    <h3 class="sous" data-t="calcTitre"></h3>
    <ol class="calcul" id="sim-calcul"></ol>

    <h3 class="sous" data-t="guichetTitre"></h3>
    <div class="barres" id="sim-barres"></div>
    <p class="note" data-t="simNote"></p>

    <h3 class="sous" data-t="admPourquoi"></h3>
    <div class="benef" id="adm-benef"></div>
    <div id="adm-cartes"></div>
    <p class="note" id="adm-portee"></p>
  </section>

  <section id="p-src" class="panneau" hidden>
    <p data-t="introSrc"></p><ol id="liste-src"></ol>
  </section>
</main>
<footer><span data-t="pied"></span> · الأستاذة سماح قسومة — مدرّبة دولية</footer>

  const pistes=r.alternatives&&r.alternatives.length?`<div class="puces"><small>${S.pistes} :</small>${r.alternatives.map(v=>`<button class="puce" data-fiche="${esc(v.id)}">${esc(v.titre)}</button>`).join("")}</div>`:"";
  if(r.type==="refus"||r.type==="vigilance"){
    h=`<div class="alerte${r.type==="refus"?" refus":""}">${esc(r.texte)}</div>${pistes}<p><button class="bouton second" data-agent="${esc(q)}">${S.agent}</button></p>`;
  }else if(r.type==="reponse"){
    const b=r.statut==="source_officielle"?["b-officiel",S.officiel]:r.statut==="interne"?["b-interne",S.interne]:["b-confirmer",S.confirmer];
    h=`${r.vigilance?`<div class="alerte">${esc(r.vigilance)}</div>`:""}<div class="titre">${esc(r.titre)}</div>${esc(r.texte)}<div class="ref"><span class="badge ${b[0]}">${b[1]}</span>${S.source} : ${esc(r.source.reference||"")}`;
    if(r.verifie_le)h+=` · ${S.verifie} ${esc(r.verifie_le)}`;
    if(r.validation_experte)h+=` · ${S.valide} ${esc(r.validation_experte.par)}`;
    if(r.source.url)h+=`<span class="url"><a href="${esc(r.source.url)}" rel="noopener">${esc(r.source.url)}</a></span>`;
    h+=`</div>`;
    if(r.action==="echeances")h+=`<p><button class="bouton second" data-voir-ech="1">${S.voirEch}</button></p>`;
    if(r.voir_aussi&&r.voir_aussi.length)h+=`<div class="puces"><small>${S.voir} :</small>${r.voir_aussi.map(v=>`<button class="puce" data-fiche="${esc(v.id)}">${esc(v.titre)}</button>`).join("")}</div>`;
  }else if(r.type==="inconnu"){
    h=esc(r.texte);
    if(r.propositions&&r.propositions.length)h+=`<div class="puces"><small>${S.vouliez}</small>${r.propositions.map(v=>`<button class="puce" data-fiche="${esc(v.id)}">${esc(v.titre)}</button>`).join("")}</div>`;
    h+=`<p><button class="bouton second" data-agent="${esc(q)}">${S.agent}</button></p>`;
  }else h=esc(r.texte||"");
  const d=bulle("bot",h);d.dir=r.langue==="ar"?"rtl":"ltr";
}
async function ouvrirFiche(id){

  const S=T[L];const d=bulle("bot",`<div class="titre">${esc(r.titre)}</div>${esc(r.texte)}<div class="ref">${S.source} : ${esc(r.source.reference||"")}${r.source.url?`<span class="url">${esc(r.source.url)}</span>`:""}</div>`);d.dir=L==="ar"?"rtl":"ltr";
}
async function chargerEcheances(){
  const S=T[L];const sel=$("profil");const actuel=sel.value||lire("mj-rappel")||"pp";

    const rep=e.report.length?`<small>${S.reporte} ${e.date_legale} (${e.report.map(x=>esc(x.motif[L])).join(", ")})</small>`:"";

}
async function verifierDecl(){

}
function nJours(j){if(L!=="ar")return j+" "+T[L].j;if(j===1)return "يوم واحد";if(j===2)return "يومان";return j+(j<=10?" أيام":" يوماً")}
function lire(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ecrire(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
async function creerRappels(){

async function bandeau(){
  const profil=lire("mj-rappel");$("bandeau").innerHTML="";if(!profil)return;
  const S=T[L];const r=await api(`/api/echeances?profil=${profil}&jours=7`);
  $("bandeau").innerHTML=r.echeances.map(e=>`<div dir="${L==="ar"?"rtl":"ltr"}">⏰ ${esc(fmt(S.bandeau,{l:e.libelle[L]+(e.periode?" · "+e.periode:""),d:e.date}))}${e.jours_restants===0?S.bandeauAuj:fmt(S.bandeauJ,{j:nJours(e.jours_restants)})}</div>`).join("");

function masquer(c){c=String(c||"");return c.length>4?c.slice(0,3)+"•••"+c.slice(-2):c}
function carteHTML(c){
  const S=T[L];const x=c.contexte||{};
  const proches=(x.fiches_proches||[]).map(f=>`<li>${esc(f.titre[L]||f.titre.fr)} — ${esc(f.source)} <span class="note">(score ${f.score})</span></li>`).join("");
  return `<div class="carte" dir="${L==="ar"?"rtl":"ltr"}"><div class="ent"><span>${esc(S.carteTitre)}</span><span class="statut">${esc(S.cOuvert)}</span></div><dl>
   <dt>${S.cNum}</dt><dd><b>${esc(c.id)}</b></dd><dt>${S.cDate}</dt><dd>${esc(String(c.horodatage||"").replace("T"," "))}</dd>
   <dt>${S.cService}</dt><dd>${esc(S.services[c.service]||c.service)}</dd><dt>${S.cLangue}</dt><dd>${esc(S.langues[c.langue]||c.langue)}</dd>
   <dt>${S.cQuestion}</dt><dd dir="auto">${esc(c.question)}</dd><dt>${S.cContact}</dt><dd>${c.contact?esc(masquer(c.contact)):S.cDemande}</dd>
   <dt>${S.cEssai}</dt><dd>${esc(S.res[x.resultat]||"")}</dd></dl>
   <div style="margin-top:6px;font-size:14px;color:var(--doux)">${S.cProches} :</div>${proches?`<ol>${proches}</ol>`:`<div>${S.cAucune}</div>`}</div>`;
}
function ouvrirAgent(q){$("f-agent").hidden=false;$("a-question").value=q||derniere;$("a-question").focus();$("f-agent").scrollIntoView({behavior:"smooth",block:"center"})}
async function envoyerAgent(){
  const q=$("a-question").value.trim();if(!q){$("a-question").focus();return}
  const sv=$("a-service").value;const r=await api("/api/ticket",{question:q,langue:L,service:sv,contact:$("a-contact").value});
  $("f-agent").hidden=true;$("a-contact").value="";
  const b=bulle("bot",esc((r.local?T[L].ticketLocal:T[L].ticket)+" "+r.id+" · "+T[L].ticketSvc+" "+T[L].services[sv])+carteHTML(r));b.dir=L==="ar"?"rtl":"ltr";
}
const SIM={q:[1000,100000,1000,20000],taux:[30,95,1,70],min:[2,20,1,6],cout:[5,40,1,15],contrib:[500,50000,500,5000],retard:[5,50,1,20],baisse:[5,60,1,25]};
const PCT=new Set(["taux","retard","baisse"]);
let admMesure=null,admAnime=false;
const nb=n=>Math.round(n).toLocaleString("fr-FR");
function compter(el,cible,suffixe){
  const reduit=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const depart=+(el.dataset.v||0);el.dataset.v=cible;
  if(reduit||depart===cible){el.textContent=nb(cible)+suffixe;return}
  const t0=performance.now(),d=700;
  (function pas(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=nb(depart+(cible-depart)*e)+suffixe;if(k<1)requestAnimationFrame(pas)})(t0);
}
function construireCurseurs(){
  const S=T[L];
  $("sim-curseurs").innerHTML=Object.entries(SIM).map(([k,[mn,mx,st,df]])=>{const v=$("s-"+k)?+$("s-"+k).value:df;
    return `<div class="curseur"><div class="haut"><label for="s-${k}">${esc(S.cur[k][0])}</label><span class="val" id="v-${k}"></span></div>
    <input type="range" id="s-${k}" min="${mn}" max="${mx}" step="${st}" value="${v}"><small id="b-${k}"></small></div>`}).join("");
  document.querySelectorAll("#sim-curseurs input").forEach(x=>x.addEventListener("input",simuler));
}
function simuler(){
  const S=T[L],u=S.u,g=k=>+$("s-"+k).value;
  for(const k in SIM){$("v-"+k).textContent=nb(g(k))+(PCT.has(k)?" %":"");$("b-"+k).textContent=S.cur[k][1].replace("{m}",admMesure===null?"—":admMesure+" %")}
  const Q=g("q"),taux=g("taux")/100,min=g("min"),cout=g("cout"),C=g("contrib"),ret=g("retard")/100,bai=g("baisse")/100;
  const res=Q*taux,h=res*min/60,j=h/7,cm=h*cout,ca=cm*12,decl=C*ret*bai;
  const E=S.e;
  const lignes=[
    [E[0],`${nb(Q)} × ${Math.round(taux*100)} %`,res,` ${u.q} ${u.mois}`],
    [E[1],`${nb(res)} × ${min} ÷ 60`,h,` ${u.h} ${u.mois}`],
    [E[2],`${nb(h)} ÷ 7`,j,` ${u.j} ${u.mois}`],
    [E[3],`${nb(h)} × ${cout} = ${nb(cm)} ${u.dt} ${u.mois} → × 12`,ca,` ${u.dt} ${u.an}`],
    [E[4],`${nb(C)} × ${Math.round(ret*100)} % × ${Math.round(bai*100)} %`,decl,` ${u.decl} ${u.mois}`]];
  const ol=$("sim-calcul");
  if(ol.children.length!==lignes.length||ol.dataset.l!==L){
    ol.dataset.l=L;
    ol.innerHTML=lignes.map((x,i)=>`<li class="apparait" style="animation-delay:${i*120}ms"><div class="lib">${esc(x[0][0])}</div><div class="base">${esc(x[0][1])}</div><div class="formule" id="f-${i}"></div><div class="res" id="r-${i}"></div></li>`).join("");
  }
  lignes.forEach((x,i)=>{$("f-"+i).textContent=x[1]+" =";compter($("r-"+i),x[2],x[3])});
  const tg=$("sim-titres");
  if(!tg.children.length||tg.dataset.l!==L){tg.dataset.l=L;tg.innerHTML=[["gH","t-h"],["gC","t-c"],["gD","t-d"]].map(([k,id])=>`<div class="apparait">${esc(S[k])}<b id="${id}">0</b></div>`).join("")}
  compter($("t-h"),h," "+u.h);compter($("t-c"),ca," "+u.dt);compter($("t-d"),decl,"");
  const max=Math.max(Q,1);
  $("sim-barres").innerHTML||( $("sim-barres").innerHTML=`<div class="barre"><div class="lib" id="bl-s"></div><div class="piste"><div class="rempli sans" id="bb-s"></div></div></div><div class="barre"><div class="lib" id="bl-a"></div><div class="piste"><div class="rempli avec" id="bb-a"></div></div></div>`);
  $("bl-s").textContent=S.sans;$("bl-a").textContent=S.avec;
  requestAnimationFrame(()=>{$("bb-s").style.width="100%";$("bb-s").textContent=nb(Q);const w=Math.max(4,(Q-res)/max*100);$("bb-a").style.width=w+"%";$("bb-a").textContent=nb(Q-res)});
}
async function chargerAdm(){
  const S=T[L];const r=await api("/api/tableau");
  const taux=r.taux||0;admMesure=r.demandes?taux:null;
  $("adm-chiffres").innerHTML=[[S.kQuestions,r.questions,""],[S.kReponses,r.resolues,"",1],[S.kTaux,taux," %",1],[S.kTickets,r.tickets,""],[S.kInconnus,r.inconnus,""],[S.kRefus,(r.refus||0)+(r.vigilance||0),""]]
    .map(([k,v,suf,f],i)=>`<div class="${f?"fort":""} apparait" style="animation-delay:${i*80}ms">${esc(k)}<b id="m-${i}" data-v="0">0</b></div>`).join("");
  [[r.questions,""],[r.resolues,""],[taux," %"],[r.tickets,""],[r.inconnus,""],[(r.refus||0)+(r.vigilance||0),""]].forEach(([v,suf],i)=>compter($("m-"+i),v,suf));
  const lang=Object.entries(r.par_langue||{}).map(([k,v])=>`${{ar:"العربية",fr:"Français",en:"English"}[k]||k} : ${v}`).join(" · ");
  const top=(r.top||[]).map(x=>`<li>${esc(x.titre[L]||x.titre.fr)} (${x.n})</li>`).join("");
  const sv=Object.entries(r.tickets_par_service||{}).map(([k,v])=>`<li>${esc(S.services[k]||k)} : ${v}</li>`).join("");
  $("adm-detail").innerHTML=(r.demandes?`<p class="note">${esc(S.kFormule(r))}</p>`:"")+(r.questions?`<p><b>${S.kLangues} :</b> ${lang}</p><p><b>${S.kTop} :</b></p><ol>${top}</ol>${sv?`<p><b>${S.kServices} :</b></p><ul>${sv}</ul>`:""}`:`<p class="note">${S.aucun}</p>`);
  if(!$("sim-curseurs").children.length||$("sim-curseurs").dataset.l!==L){construireCurseurs();$("sim-curseurs").dataset.l=L}
  simuler();
  $("adm-benef").innerHTML=S.benef.map(([t,x])=>`<div><h4>${esc(t)}</h4>${esc(x)}</div>`).join("");
  $("adm-portee").textContent=r.portee==="session"?S.porteeSession:S.porteeServeur;
  $("adm-cartes").innerHTML=(r.cartes&&r.cartes.length)?`<h3 class="sous">${S.cartesSession}</h3>`+r.cartes.map(carteHTML).join(""):"";
}
async function chargerSources(){
  const r=await api("/api/sources");
  $("liste-src").innerHTML=r.sources.map(s=>`<li>${esc(s.reference)}${s.url?`<span class="url">${esc(s.url)}</span>`:""}</li>`).join("");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.l)appliquer(t.dataset.l);
  else if(t.dataset.onglet){document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b===t));
    ["chat","ech","verif","adm","src"].forEach(o=>$("p-"+o).hidden=o!==t.dataset.onglet);if(t.dataset.onglet==="src")chargerSources();if(t.dataset.onglet==="adm")chargerAdm()}
  else if(t.dataset.fiche)ouvrirFiche(t.dataset.fiche);
  else if(t.dataset.agent!==undefined)ouvrirAgent(t.dataset.agent);
  else if(t.id==="b-agent")ouvrirAgent("");
  else if(t.id==="b-ics")creerRappels();
  else if(t.dataset.voirEch){document.querySelector('nav button[data-onglet="ech"]').click()}
  else if(t.id==="b-envoyer-agent")envoyerAgent();
  else if(t.id==="b-annuler-agent")$("f-agent").hidden=true;
  else if(t.classList.contains("puce")&&t.parentElement.id==="exemples")poser(t.textContent);
  else if(t.id==="b-verif")verifierDecl();
});
$("f-question").addEventListener("submit",e=>{e.preventDefault();poser($("q").value)});
$("profil").addEventListener("change",chargerEcheances);
$("r-ouverture").checked=!!lire("mj-rappel");
$("r-ouverture").addEventListener("change",e=>{ecrire("mj-rappel",e.target.checked?$("profil").value:null);bandeau()});
$("profil").addEventListener("change",()=>{if($("r-ouverture").checked){ecrire("mj-rappel",$("profil").value);bandeau()}});
const m=new Date();m.setMonth(m.getMonth()-1);$("v-periode").value=m.toISOString().slice(0,7);
appliquer(L);
</script>
